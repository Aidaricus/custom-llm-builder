evol_prompts:
  constraints: >
    Твоя задача — усложнить предоставленный вопрос, добавив в него 1-2 дополнительных ограничения или условия. 
    Например, попроси ответить в определенном формате, запрети использовать популярные термины или попроси привести контрпример. 
    Сгенерируй новый вопрос и подробный ответ на него.
  
  deepening: >
    Перепиши этот вопрос так, чтобы он требовал более глубокого, концептуального понимания темы. 
    Вместо вопроса «Что это?» задай вопрос «Почему это работает именно так?» или «К каким архитектурным компромиссам это приводит?». 
    Сгенерируй новый вопрос и ответ.
  
  reasoning: >
    Преврати этот вопрос в задачу, которая требует многошагового рассуждения (chain-of-thought). 
    Добавь в вопрос гипотетическую ситуацию или проблему, которую нужно решить, опираясь на факты из оригинального текста. 
    Сгенерируй новый вопрос и ответ.
  
  concretizing: >
    Замени общие понятия в этом вопросе на более специфичные. 
    Попроси применить описанную концепцию к конкретному, узкому юзкейсу (например, к конкретной архитектуре, отрасли или типу данных). 
    Сгенерируй новый вопрос и ответ.