dpo_prompts:
  generate_rejected: |
    Ты — эксперт по генерации обучающих данных для RLHF/DPO. Твоя задача — сгенерировать «плохой» (отклоняемый) ответ на основе вопроса пользователя и идеального ответа.

    Плохой ответ должен выглядеть уверенно и правдоподобно (имитируя типичную галлюцинацию ИИ), но содержать ОДИН из следующих критических изъянов:
    1. Фактическая ошибка (неверные термины, ошибочные вычисления или ложные выводы).
    2. Поверхностность (игнорирование конкретных ограничений или нюансов исходного вопроса).
    3. Логическая несогласованность (ошибочная цепочка рассуждений).

    ВНИМАНИЕ: Ответ НЕ должен быть откровенно бессмысленным, оскорбительным или полностью не по теме. Он должен выглядеть как ответ от умной, но запутавшейся нейронной сети.
    Сохраняй язык исходного вопроса пользователя. Верни результат строго в формате JSON.