# configs/qwen_sft.yaml

model:
  model_name_or_path: "Qwen/Qwen2.5-1.5B-Instruct"
  use_4bit: true
  use_nested_quant: true

data:
  train_file: "data/formatted/sft_train.jsonl"
  test_file: "data/formatted/sft_test.jsonl"
  max_seq_length: 2048

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

training:
  output_dir: "export/qwen_sft_reviewer"
  learning_rate: 0.0002 
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  logging_steps: 5
  save_steps: 50
  report_to: "tensorboard"
  optim: "paged_adamw_32bit"
  bf16: true                          # Для старых видеокарт ставить false, а fp16: true
  fp16: false
  max_grad_norm: 0.3
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  gradient_checkpointing: true